<!DOCTYPE html>
<html>
<body style="font-family: Arial; font-size: 19px; margin: 0; padding: 0;">

<!-- Main Wrapper (centers all content in email clients) -->
<div style="max-width: 600px; margin: 0 auto; text-align: center; padding: 10px;">

    <!-- Header Image -->
    <div style="margin-bottom: 10px; width: 100%; text-align: center;">
        <img src="cid:headerImage"
             alt="Get Your DL Portal"
             style="width: 100%; max-width: 600px; height: 120px; object-fit: cover; display: block; margin: 0 auto;"/>
    </div>

    <h2>Hello {{name}},</h2>

    <p>
        Thank you for registering at <b>Get Your DL Portal</b>.
    </p>

    <p>
        Please click the button below to verify your email:
    </p>

    <!-- Button -->
    <div style="text-align: center; margin: 20px 0;">
        <a href="{{link}}"
           style="background-color: #28a745; color: white; padding: 12px 25px;
                  text-decoration: none; border-radius: 6px; display: inline-block;
                  font-weight: bold;">
            Verify Email
        </a>
    </div>

    <p>
        This link will expire in <b>24 hours</b>.
    </p>

    <p>
        Regards,<br/>Get Your DL Portal Team
    </p>

</div>

</body>
</html>
